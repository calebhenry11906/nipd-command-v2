name: Autonomous change boundary
on:
  push:
    branches: [feature/staging-mandatory-mfa]
    paths:
      - 'tests/autonomous-change-boundary.cjs'
      - '.github/workflows/autonomous-change-boundary.yml'
      - 'AGENTS.md'
      - 'docs/autonomous-development-policy.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  unattended-development-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate development policy
        run: |
          node --check tests/autonomous-change-boundary.cjs
          node tests/autonomous-change-boundary.cjs --self-test
      - name: Check PR changed paths (fail closed)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tests/autonomous-change-boundary.cjs
