name: React modernization validation
on:
  push:
    branches: [feature/react-2026-foundation]
  pull_request:
    paths:
      - 'react-app/**'
      - '.github/workflows/react-modernization-ci.yml'
permissions:
  contents: read
jobs:
  react-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript validation
        run: npm run typecheck
      - name: Vite production build
        run: npm run build
